<!--
  Custom metadata: author/blog entities for search engines and AI systems, plus
  discovery hints for the llms.txt endpoints.

  Note: jekyll-seo-tag already emits the per-page WebSite/BlogPosting JSON-LD,
  so this hook deliberately only adds the entities it does not cover.
-->

<link rel="alternate" type="text/plain" title="llms.txt" href="{{ '/llms.txt' | relative_url }}">
<link rel="author" href="{{ '/about/' | relative_url }}">

{% if page.layout == 'post' and page.tags.size > 0 %}
  <meta name="keywords" content="{{ page.tags | join: ', ' }}">
{% endif %}

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "{{ '/about/' | absolute_url }}#person",
        "name": "{{ site.social.name }}",
        "alternateName": "{{ site.github.username }}",
        "url": "{{ '/' | absolute_url }}",
        "email": "{{ site.social.email }}",
        "jobTitle": "Security Engineer",
        "knowsAbout": [
          "AI security",
          "Prompt injection",
          "Large language model security",
          "Binary exploitation",
          "Reverse engineering",
          "Program analysis",
          "Symbolic execution",
          "Network security"
        ],
        "sameAs": [
          {% for link in site.social.links %}"{{ link }}"{% unless forloop.last %},{% endunless %}{% endfor %}
        ]
      },
      {
        "@type": "Blog",
        "@id": "{{ '/' | absolute_url }}#blog",
        "name": {{ site.title | jsonify }},
        "description": {{ site.description | strip_newlines | strip | jsonify }},
        "url": "{{ '/' | absolute_url }}",
        "inLanguage": "{{ site.lang | default: 'en' }}",
        "author": { "@id": "{{ '/about/' | absolute_url }}#person" },
        "publisher": { "@id": "{{ '/about/' | absolute_url }}#person" }
      }
      {%- if page.layout == 'post' -%}
        ,
        {
          "@type": "WebPage",
          "@id": "{{ page.url | absolute_url }}",
          "isPartOf": { "@id": "{{ '/' | absolute_url }}#blog" },
          "author": { "@id": "{{ '/about/' | absolute_url }}#person" }
          {%- if page.categories.size > 0 -%},
            "about": {{ page.categories | jsonify }}
          {%- endif -%}
        }
      {%- endif -%}
    ]
  }
</script>
